<svg xmlns="http://www.w3.org/2000/svg" width="360" height="230" viewBox="0 0 360 230" role="img" aria-labelledby="gapless-title gapless-desc">
  <title id="gapless-title">A spectrum without a positive mass gap</title>
  <desc id="gapless-desc">The gold point is the vacuum at energy zero. Positive excitation energies approach zero without a strictly positive lower bound. This does not assert an excited state at zero energy. The energy axis uses the same scale as the gapped illustration. This is a schematic illustration, not a computed Yang–Mills spectrum.</desc>
  <defs>
    <linearGradient id="gapless-band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2e8177" stop-opacity=".28"/>
      <stop offset="1" stop-color="#2e8177" stop-opacity=".06"/>
    </linearGradient>
    <pattern id="gapless-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(25)">
      <path d="M0 0V8" stroke="#2e8177" stroke-opacity=".16" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="360" height="230" rx="12" fill="#f8f8f2"/>
  <rect x="44" y="61" width="274" height="99" fill="url(#gapless-band)"/>
  <rect x="44" y="61" width="274" height="99" fill="url(#gapless-hatch)"/>
  <path d="M47 61H318" fill="none" stroke="#2e8177" stroke-opacity=".5"/>
  <circle cx="44" cy="61" r="3" fill="#f8f8f2" stroke="#2e8177" stroke-width="1.3"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#0b3537">
    <text x="242" y="44" text-anchor="middle" font-size="17" fill="#2e8177">Excitations</text>
    <text x="96" y="96" font-family="Georgia, serif" font-size="25" fill="#2e8177">E → 0⁺</text>
    <path d="M89 89H56M62 84L56 89L62 94" fill="none" stroke="#2e8177" stroke-width="1.4"/>
    <text x="181" y="131" text-anchor="middle" font-size="17">No positive gap</text>
    <path d="M25 160H333M327 155L333 160L327 165" fill="none" stroke="#0b3537" stroke-width="1.5"/>
    <path d="M44 160V166M112 160V165M180 160V165M248 160V165M316 160V165" fill="none" stroke="#0b3537" stroke-opacity=".35"/>
    <circle cx="44" cy="160" r="6" fill="#b88144" stroke="#f8f8f2" stroke-width="2"/>
    <text x="44" y="187" text-anchor="middle" font-size="17">0</text>
    <text x="44" y="212" text-anchor="middle" font-size="17">Vacuum</text>
    <text x="328" y="212" text-anchor="end" font-size="18">Energy E</text>
  </g>
</svg>
